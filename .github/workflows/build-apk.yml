name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK vorbereiten
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"


      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Projekt entpacken
        run: unzip -o DndSceneBoard_v0.1.1_buildready.zip -d buildsrc

      - name: APK bauen
        working-directory: buildsrc/DndSceneBoard
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: DndSceneBoard-APK
          path: buildsrc/DndSceneBoard/app/build/outputs/apk/debug/app-debug.apk
